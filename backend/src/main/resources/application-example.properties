# ============================================================
# MediStock Backend Configuration Template (application-example.properties)
# Copy this file to application.properties and configure your values.
# application.properties is gitignored — NEVER commit real credentials to Git.
# ============================================================

# Database Configuration (PostgreSQL / Neon DB)
# Reads DB_URL, DB_USERNAME, DB_PASSWORD from environment variables if present.
# For Local PostgreSQL:
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medistock_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver

# For Neon Serverless PostgreSQL, set DB_URL to:
# jdbc:postgresql://<neon-host>/medistock?sslmode=require

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP Connection Pool Configuration
spring.datasource.hikari.pool-name=MedTrackHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# Server Configuration
server.port=${PORT:8080}

# JWT Settings (Provide a secure 256-bit secret key in production)
jwt.secret=${JWT_SECRET:YOUR_SECURE_256_BIT_SECRET_KEY_HERE}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Inventory Settings
inventory.near-expiry-days=30

